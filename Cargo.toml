[package]
name = "astral-power-monitor"
version = "0.6.1"
edition = "2024"
rust-version = "1.88"
description = "Native Windows tray monitor for ASUS Astral GPU per-pin current"
repository = "https://github.com/tgbender/astral-power-monitor"
license = "Unlicense AND MIT"

[[bin]]
name = "AstralPowerMonitor"
path = "src/main.rs"

[dependencies]
nvapi-sys = "0.1.3"
serde_json = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
